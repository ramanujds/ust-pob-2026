<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Count <span id="count">0</span></h1>

    <button onclick="increment()">Increment</button> | <button onclick="decrement()">Decrement</button>


</body>

<script>
    function increment(){
        let content = document.getElementById("count");
        let count = content.innerHTML
        count++;
        content.innerHTML = count
    }

    function decrement(){
        let content = document.getElementById("count");
        let count = content.innerHTML
        count--;
        content.innerHTML = count
    }

</script>

</html>
